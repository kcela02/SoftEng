{% extends "base_auth.html" %}

{% block title %}Register - VapeCrib{% endblock %}

{% block auth_title %}Create Account{% endblock %}

{% block content %}
<div id="register-messages"></div>

<form id="registerForm" method="POST" class="auth-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
    <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Choose a username" required autofocus>
    </div>
    
    <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
    </div>
    
    <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Create a password" required>
    </div>
    
    <div class="form-group">
        <label for="role">Role</label>
        <select id="role" name="role">
            <option value="user">User</option>
            <option value="admin">Admin</option>
        </select>
    </div>
    
    <button type="submit" class="auth-btn">Create Account</button>
</form>

<div class="auth-footer">
    <p>Already have an account? <a href="{{ url_for('auth.login') }}">Login here</a></p>
</div>
{% endblock %}
